<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or '酒店订单管理' }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="{{ url_for('orders') }}">酒店订单管理</a>{% if current_user.is_authenticated %}<div class="text-white">{{ current_user.username }} {% if current_user.is_admin %}<a class="text-white ms-2" href="{{ url_for('users') }}">员工管理</a>{% endif %}<a class="text-white ms-3" href="{{ url_for('logout') }}">退出</a></div>{% endif %}</div></nav><main class="container py-4">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
