{% extends 'base.html' %}{% block content %}<h1 class="h3">员工账号管理</h1><form method="post" class="row g-2 mb-4"><div class="col"><input class="form-control" name="username" placeholder="新员工用户名" required></div><div class="col"><input class="form-control" type="password" name="password" placeholder="初始密码（至少6位）" required minlength="6"></div><div class="col-auto"><button class="btn btn-primary">添加员工</button></div></form><table class="table bg-white"><thead><tr><th>用户名</th><th>角色</th><th>操作</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ '管理员' if u.is_admin else '员工' }}</td><td>{% if not u.is_admin %}<form method="post" action="{{ url_for('delete_user',user_id=u.id) }}"><button class="btn btn-sm btn-danger" onclick="return confirm('删除此员工及其订单？')">删除</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table>{% endblock %}
